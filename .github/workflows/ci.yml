name: ACaaS Continuous Integration & Artifact Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ACAAS_LEDGER_BACKEND: memory
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest matplotlib httpx

      - name: Run 33-test Conformance Suite
        run: |
          pytest tests/unit tests/blockchain tests/cross -v

      - name: Start Docker Stack (for live security & integration checks)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.experiments.yml up -d --wait
          docker compose ps

      - name: Run 21 Security Assertions
        run: |
          pytest -m security tests/security/ -v

      - name: Run Full Integration & Soak Tests
        run: |
          pytest tests/ -v

      - name: Run E1-E12 Quick Evaluation
        run: |
          bash experiments/run_all.sh --quick

      - name: Verify Experiment Parameters
        run: |
          python experiments/check_params.py

      - name: Generate Publication Figures
        run: |
          python experiments/plots/generate_plots.py

      - name: Upload Artifact Evaluation Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acaas-evaluation-results
          path: results/
