# ACaaS Multi-Site Soak Test Overlay (P5 / E12)
# Configures 3 distinct edge sites: site-urban, site-clinic, site-mobile
# Each site has dedicated PEP, Edge PDP, Data Minimizer, Sync Client, and Proxy instances.

services:

  # ── Site 1: Urban Hospital Ward Gateway ─────────────────────────────────────
  urban-proxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: -host=0.0.0.0
    networks: [edge-net, cloud-net]
    profiles: ["soak"]

  urban-edge-pdp:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python edge/lightweight-pdp/main.py
    ports: ["8103:8103"]
    environment:
      EDGE_PDP_PORT: 8103
      EDGE_DB_PATH: /data/urban_edge.db
      PYTHONPATH: /app
    volumes: [edge-data:/data]
    networks: [edge-net]
    profiles: ["soak"]

  urban-data-minimizer:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python edge/data-minimizer/main.py
    ports: ["8104:8104"]
    environment:
      DATA_MINIMIZER_PORT: 8104
      PYTHONPATH: /app
    networks: [edge-net]
    profiles: ["soak"]

  urban-pep:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python edge/pep/main.py
    ports: ["8105:8105"]
    environment:
      PEP_PORT: 8105
      EDGE_PDP_URL: http://urban-edge-pdp:8103
      DATA_MINIMIZER_URL: http://urban-data-minimizer:8104
      CLOUD_PDP_URL: http://urban-proxy:18002
      QUEUE_DB_PATH: /data/urban_queue.db
      EDGE_NODE_ID: site-urban
      PYTHONPATH: /app
    volumes: [edge-data:/data]
    networks: [edge-net]
    depends_on:
      - urban-edge-pdp
      - urban-data-minimizer
      - urban-proxy
    profiles: ["soak"]

  urban-sync-client:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python sync/client/sync_client.py
    environment:
      EDGE_NODE_ID: site-urban
      SYNC_SERVER_URL: http://urban-proxy:18006
      PMS_URL: http://urban-proxy:18001
      HEARTBEAT_SEC: 1
      EDGE_DB_PATH: /data/urban_edge.db
      QUEUE_DB_PATH: /data/urban_queue.db
      ACAAS_LEDGER_BACKEND: redis
      ACAAS_REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    volumes: [edge-data:/data]
    networks: [edge-net]
    depends_on:
      - urban-proxy
      - sync-server
    profiles: ["soak"]

