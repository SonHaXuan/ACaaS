syntax = "proto3";
package acaas.sync;

// PolicySyncService: cloud → edge streaming policy updates (Section 4.2)
service PolicySyncService {
  // Edge subscribes to receive policy update events
  rpc SubscribeUpdates(SubscribeRequest) returns (stream PolicyUpdateEvent);
  // Edge calls getDelta for offline-to-online reconciliation (Phase C)
  rpc GetDelta(DeltaRequest) returns (stream PolicyUpdateEvent);
  // Edge acknowledges receipt of an update
  rpc AcknowledgeUpdate(AckRequest) returns (AckResponse);
}

message SubscribeRequest {
  string edge_node_id = 1;
  int64  last_known_version = 2;
}

message PolicyUpdateEvent {
  string policy_id      = 1;
  int64  prev_version   = 2;
  int64  new_version    = 3;
  string hash           = 4;   // SHA-256 of policy rule
  string issuer_sig     = 5;
  bytes  policy_body    = 6;   // JSON-encoded Policy (lazy, may be empty)
  string event_type     = 7;   // CREATE | UPDATE | DELETE
  int64  timestamp      = 8;
}

message DeltaRequest {
  string edge_node_id   = 1;
  int64  from_version   = 2;
  int64  to_version     = 3;   // 0 = latest
}

message AckRequest {
  string edge_node_id   = 1;
  string policy_id      = 2;
  int64  version        = 3;
}

message AckResponse {
  bool   ok             = 1;
  string message        = 2;
}
